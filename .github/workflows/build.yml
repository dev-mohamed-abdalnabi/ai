name: Build and Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v1.0.0'
        default: 'v0.0.0-manual'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_NAME: FlowAgent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Version
        id: v
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          VER="${TAG#v}"; BASE="${VER%%-*}"
          IFS=. read -r MA MI PA <<< "$BASE"
          CODE=$(( ${MA:-0}*1000000 + ${MI:-0}*1000 + ${PA:-0} ))
          [ "$CODE" -gt 0 ] || CODE=${{ github.run_number }}
          PRE=false; [[ "$VER" == *-* ]] && PRE=true
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"; echo "pre=$PRE" >> "$GITHUB_OUTPUT"
      - name: Rebuild folder tree from flat files
        run: bash setup.sh
      - name: Prepare signing key
        env:
          S_B64: ${{ secrets.KEYSTORE_B64 }}
          S_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KPW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$S_B64" ]; then
            echo "$S_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            { echo "KEYSTORE_PASSWORD=$S_PW"; echo "KEY_ALIAS=$S_ALIAS"; echo "KEY_PASSWORD=$S_KPW"; echo "KEY_KIND=custom"; } >> "$GITHUB_ENV"
          else
            base64 -d test_keystore_b64.txt > "$RUNNER_TEMP/release.jks"
            { echo "KEYSTORE_PASSWORD=android-test"; echo "KEY_ALIAS=testkey"; echo "KEY_PASSWORD=android-test"; echo "KEY_KIND=test"; } >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and lint
        working-directory: build_tree
        run: gradle --no-daemon testDebugUnitTest lintDebug
      - name: Build release APK
        working-directory: build_tree
        run: >
          gradle --no-daemon assembleRelease
          -PappVersionName=${{ steps.v.outputs.name }}
          -PappVersionCode=${{ steps.v.outputs.code }}
          -PappCommit=${GITHUB_SHA::7}
      - name: Collect, verify, checksum
        run: |
          mkdir -p dist
          APK=$(ls build_tree/app/build/outputs/apk/release/*.apk | head -n1)
          OUT="dist/${APP_NAME}-${{ steps.v.outputs.tag }}-android.apk"
          cp "$APK" "$OUT"
          AS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner
          "$AS" verify --print-certs "$OUT" | tee cert.txt
          FP=$(grep -m1 'SHA-256 digest' cert.txt | awk '{print $NF}')
          (cd dist && sha256sum * > SHA256SUMS.txt)
          for f in dist/*; do [ -s "$f" ] || { echo "empty: $f"; exit 1; }; done
          {
            echo "## Install"; echo "Download the APK, open it on your phone, allow installing from this source, tap Install."
            echo; echo "## Signing"; echo "Key: ${KEY_KIND}. Certificate SHA-256: \`$FP\`"
            [ "$KEY_KIND" = test ] && echo "WARNING: public test key. Not for Google Play."
          } > notes.md
          { echo "### Build summary"; echo "Version: ${{ steps.v.outputs.name }} (code ${{ steps.v.outputs.code }})"
            echo '```'; ls -l dist; cat dist/SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ steps.v.outputs.pre == 'true' }}
