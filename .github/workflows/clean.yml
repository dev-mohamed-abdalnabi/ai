name: Clean Repo
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب DELETE للتأكيد (هيمسح كل الملفات ماعدا الـ workflow ده)'
        required: true
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete everything except this workflow
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "DELETE" ] || { echo "Not confirmed. Type DELETE."; exit 1; }
          KEEP=".github/workflows/clean.yml"
          git ls-files -z | grep -zvxF "$KEEP" | xargs -0 -r git rm -q --
          if git diff --cached --quiet; then
            echo "Nothing to delete."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Clean repo: remove all files except clean.yml"
            git push
          fi
